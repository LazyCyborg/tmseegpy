name: tmseegpy-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # Core scientific packages
  - numpy=1.26.0
  - scipy=1.12.0
  - scikit-learn=1.4.0
  - pandas=2.2.0
  - tensorflow
  # Visualization
  - matplotlib=3.9.2
  - seaborn=0.13.2
  - plotly=5.18.0
  # MNE ecosystem
  - mne=1.9.0
  - mne-qt-browser
  - mne-icalabel
  - mne-icalabel
  # Jupyter support
  - ipykernel=6.29.0
  - ipympl=0.9.3
  - matplotlib-inline=0.1.6
  # Utilities
  - psutil=5.9.8
  - tqdm=4.66.2
  - appdirs=1.4.4
  # Web components
  - streamlit=1.31.0
  - pip=23.3.1
  - pip:
    - tensorly==0.8.1
    - construct==2.10.70
    - mne-faster==1.2
    - pyopengl==3.1.7
    - PyQt6>=6.4.0
    - PyQt6-Qt6
    - PyQt6-sip